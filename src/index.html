<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, user-scalable=no">
  <title>Custom TV Launcher</title>
  
  <!-- Chromium 79 Optimized Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/contrast.css">
  <link rel="stylesheet" href="css/weather-bg.css">
  <link rel="stylesheet" href="css/navigation.css">

  <!-- Early synchronous theme resolution from localStorage (0ms First Paint) -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('tvlauncher_weather_cache');
        if (raw) {
          var d = JSON.parse(raw);
          var c = (d.current && typeof d.current.weather_code === 'number') ? d.current.weather_code : 0;
          var day = d.current ? d.current.is_day : 0;
          var t = 'clear-night';
          if (c <= 2) t = day ? 'clear-day' : 'clear-night';
          else if (c <= 48) t = day ? 'cloudy-day' : 'cloudy-night';
          else if (c <= 82) t = 'rain';
          else if (c <= 99) t = 'storm';
          window.__initialTheme = t;
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- 1. Background Layers (Smooth CSS Crossfade) -->
  <div class="bg-container">
    <div id="bg-layer-a" class="bg-layer bg-theme-default active"></div>
    <div id="bg-layer-b" class="bg-layer bg-theme-default"></div>
  </div>
  <script>
    if (window.__initialTheme) {
      var la = document.getElementById('bg-layer-a');
      if (la) la.className = 'bg-layer bg-theme-' + window.__initialTheme + ' active';
    }
  </script>

  <!-- 2. Multi-Layer Contrast Protection Scrim (Anti-Glare Dimming) -->
  <div class="scrim-overlay scrim-dimmer"></div>
  <div class="scrim-overlay scrim-vignette"></div>
  <div class="scrim-overlay scrim-gradient"></div>

  <!-- 3. Main Application Canvas (1920x1080) -->
  <div id="app">
    
    <!-- Top Header: Clock (Left) + Weather Widget Today & Tomorrow (Right) -->
    <header class="header-container">
      
      <!-- Top-Left: Digital Clock & Date Badge -->
      <div class="clock-widget">
        <div id="clock-time" class="clock-time">
          <span id="clock-hour">00</span><span id="clock-colon" class="clock-colon">:</span><span id="clock-min">00</span>
        </div>
        <div class="clock-date-pill frosted-glass">
          <span class="date-pill-dot"></span>
          <span id="clock-date" class="clock-date">Đang tải ngày...</span>
        </div>
      </div>

      <!-- Top-Right: Weather Widget (Today + Tomorrow - Xuan Phuong, Hanoi) -->
      <div class="weather-card frosted-glass">
        
        <!-- Today / Current Weather Section -->
        <div class="weather-today-section">
          <div id="weather-icon" class="weather-icon-large">
            <!-- Dynamic SVG icon inserted here -->
          </div>
          <div class="weather-info">
            <div id="weather-temp" class="weather-temp">--°C</div>
            <div class="weather-location-wrap">
              <span class="location-beacon"></span>
              <span id="weather-location" class="weather-location">Xuân Phương, Hà Nội</span>
            </div>
            <div id="weather-desc" class="weather-desc">Đang cập nhật thời tiết...</div>
          </div>
        </div>

        <!-- Subtle Vertical Divider -->
        <div class="weather-divider"></div>

        <!-- Tomorrow Weather Section -->
        <div class="weather-tomorrow-section">
          <div class="weather-tomorrow-header">
            <span class="weather-tomorrow-badge">Ngày mai</span>
            <span id="weather-tomorrow-date" class="weather-tomorrow-date">--/--</span>
          </div>
          <div class="weather-tomorrow-body">
            <div id="weather-tomorrow-icon" class="weather-tomorrow-icon">
              <!-- Tomorrow SVG icon inserted here -->
            </div>
            <div class="weather-tomorrow-info">
              <div id="weather-tomorrow-temps" class="weather-tomorrow-temps">
                <span class="tomorrow-max">--°C</span>
                <span class="tomorrow-sep">/</span>
                <span class="tomorrow-min">--°C</span>
              </div>
              <div id="weather-tomorrow-desc" class="weather-tomorrow-desc">--</div>
            </div>
          </div>
        </div>

      </div>

    </header>

    <!-- Bottom Section: Pinned Apps Home Row -->
    <main class="home-row-wrapper">
      <div class="home-row-label">Ứng dụng yêu thích</div>
      <div id="home-row" class="home-row">
        <!-- Rendered instantly from localStorage: YouTube, VTV Go, FPT Play + All Apps Drawer Tile -->
      </div>
    </main>

  </div>

  <!-- 4. Modal Drawer: All Apps Grid -->
  <div id="drawer-modal" class="drawer-modal" role="dialog" aria-modal="true">
    <div class="drawer-header">
      <div class="drawer-title-group">
        <h2 class="drawer-title">Tất cả ứng dụng</h2>
        <span class="drawer-subtitle">Danh sách đầy đủ ứng dụng trên TV</span>
      </div>

      <button id="drawer-close-btn" class="drawer-close-btn" tabindex="0">
        <span>Đóng (Back)</span>
      </button>
    </div>

    <!-- 5 Columns Responsive Grid -->
    <div class="drawer-grid-container">
      <div id="drawer-grid" class="drawer-grid">
        <!-- Dynamically populated from Luna applicationManager/listApps -->
      </div>
    </div>

    <!-- Floating Remote Hints Bar at Drawer Bottom -->
    <div class="drawer-hints-bar frosted-glass">
      <div class="drawer-hint-item">
        <span class="key-pill key-ok">OK</span>
        <span class="hint-text">Mở ứng dụng</span>
      </div>
      <div class="drawer-hint-item">
        <span class="key-pill key-hold">Giữ OK (800ms)</span>
        <span class="hint-text">Ghim / Bỏ ghim</span>
      </div>
      <div class="drawer-hint-item">
        <span class="key-pill key-back">Back</span>
        <span class="hint-text">Đóng danh sách</span>
      </div>
      <div class="drawer-hint-item">
        <span class="key-pill key-nav">▲▼◀▶</span>
        <span class="hint-text">Di chuyển</span>
      </div>
    </div>
  </div>

  <!-- Application Logic Modules -->
  <script src="js/storage.js"></script>
  <script src="js/luna.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/drawer.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
